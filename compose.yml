services:
  agent:
    build: .
    # Self-hosted only: plow-agents mint writes this KEY=VALUE file. Hosted
    # Plow does not read Compose and injects PLOW_API_BASE/identity itself.
    env_file: ${PLOW_CREDENTIALS:-${PLOW_CREDENTIALS_PATH:-./plow-credentials}}
    environment:
      AGENT_ID: ${AGENT_ID:?Set AGENT_ID to your stable Agent Index id}
      GH_CONFIG_DIR: /var/lib/hermes/.config/gh
    volumes:
      - agent-home:/var/lib/hermes
    # Keep the local installation available after a transient supervised
    # process failure. The cloud deployer owns lifecycle there.
    restart: unless-stopped
    stop_grace_period: 35s

volumes:
  agent-home:
